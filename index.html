<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoloForge - 试用入口</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 23, 42, 0.9);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), #0f172a 60%, #111827);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px 24px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: 2rem;
    }

    .hero p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 760px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      font-size: 0.95rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(56, 189, 248, 0.22);
    }

    .frame-wrap {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 82vh;
      min-height: 720px;
      border: 0;
      display: block;
      background: white;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 1.5rem; }
      iframe { height: 70vh; min-height: 560px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>SoloForge 试用入口</h1>
      <p>这是一个可视化创作工具，适合组织思路、搭建剧情结构、管理模块与连线关系。下面这个容器内就是可直接体验的应用界面。</p>
      <div class="actions">
        <span class="pill">内嵌试用</span>
        <span class="pill">无需跳转</span>
        <a class="btn" href="SoloForgeV3.4.html" target="_blank">单独打开</a>
      </div>
    </section>

    <section class="frame-wrap">
      <iframe src="SoloForgeV3.4.html" title="SoloForge 应用"></iframe>
    </section>
  </div>
</body>
</html>
